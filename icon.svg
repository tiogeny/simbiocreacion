<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#21262d" stroke-width="3" stroke-dasharray="6 6"/>
  
  <!-- Outer Wheel of 8 nodes with connections -->
  <g filter="url(#glow)">
    <!-- Harmonic web links -->
    <line x1="256" y1="76" x2="383" y2="129" stroke="#FF2E4C" stroke-width="3" opacity="0.6"/>
    <line x1="383" y1="129" x2="436" y2="256" stroke="#FF9500" stroke-width="3" opacity="0.6"/>
    <line x1="436" y1="256" x2="383" y2="383" stroke="#FFCC00" stroke-width="3" opacity="0.6"/>
    <line x1="383" y1="383" x2="256" y2="436" stroke="#34C759" stroke-width="3" opacity="0.6"/>
    <line x1="256" y1="436" x2="129" y2="383" stroke="#00C7BE" stroke-width="3" opacity="0.6"/>
    <line x1="129" y1="383" x2="76" y2="256" stroke="#007AFF" stroke-width="3" opacity="0.6"/>
    <line x1="76" y1="256" x2="129" y2="129" stroke="#AF52DE" stroke-width="3" opacity="0.6"/>
    <line x1="129" y1="129" x2="256" y2="76" stroke="#FF2D55" stroke-width="3" opacity="0.6"/>

    <!-- Converging spiral lines to center -->
    <path d="M 256 76 Q 320 180 256 256" fill="none" stroke="#FF2E4C" stroke-width="4" stroke-linecap="round"/>
    <path d="M 383 129 Q 340 220 256 256" fill="none" stroke="#FF9500" stroke-width="4" stroke-linecap="round"/>
    <path d="M 436 256 Q 340 280 256 256" fill="none" stroke="#FFCC00" stroke-width="4" stroke-linecap="round"/>
    <path d="M 383 383 Q 320 320 256 256" fill="none" stroke="#34C759" stroke-width="4" stroke-linecap="round"/>
    <path d="M 256 436 Q 200 320 256 256" fill="none" stroke="#00C7BE" stroke-width="4" stroke-linecap="round"/>
    <path d="M 129 383 Q 180 300 256 256" fill="none" stroke="#007AFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M 76 256 Q 180 240 256 256" fill="none" stroke="#AF52DE" stroke-width="4" stroke-linecap="round"/>
    <path d="M 129 129 Q 190 190 256 256" fill="none" stroke="#FF2D55" stroke-width="4" stroke-linecap="round"/>

    <!-- 8 Genotype Nodes -->
    <circle cx="256" cy="76" r="26" fill="#FF2E4C" stroke="#fff" stroke-width="4"/>
    <circle cx="383" cy="129" r="26" fill="#FF9500" stroke="#fff" stroke-width="4"/>
    <circle cx="436" cy="256" r="26" fill="#FFCC00" stroke="#fff" stroke-width="4"/>
    <circle cx="383" cy="383" r="26" fill="#34C759" stroke="#fff" stroke-width="4"/>
    <circle cx="256" cy="436" r="26" fill="#00C7BE" stroke="#fff" stroke-width="4"/>
    <circle cx="129" cy="383" r="26" fill="#007AFF" stroke="#fff" stroke-width="4"/>
    <circle cx="76" cy="256" r="26" fill="#AF52DE" stroke="#fff" stroke-width="4"/>
    <circle cx="129" cy="129" r="26" fill="#FF2D55" stroke="#fff" stroke-width="4"/>

    <!-- Central MPI Phenotype Halo & Core -->
    <circle cx="256" cy="256" r="64" fill="none" stroke="#ff2a85" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="256" cy="256" r="48" fill="#ff2a85" stroke="#ffffff" stroke-width="6"/>
  </g>
  
  <!-- Central Symbol -->
  <text x="256" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff">MPI</text>
</svg>
